services:
  neoflgpt:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TRADINGAGENTS_URL: http://tradingagents:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      tradingagents:
        condition: service_healthy
    restart: unless-stopped

  tradingagents:
    build:
      context: ./services/tradingagents_bridge
      dockerfile: Dockerfile
    environment:
      ACCOUNT_GATEWAY_URL: ${ACCOUNT_GATEWAY_URL}
      ACCOUNT_GATEWAY_TOKEN: ${ACCOUNT_GATEWAY_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TRADINGAGENTS_BRIDGE_TOKEN: ${TRADINGAGENTS_BRIDGE_TOKEN:-}
      ALPACA_EXECUTION_TIMEOUT_MS: ${ALPACA_EXECUTION_TIMEOUT_MS:-30000}
    expose:
      - "8000"
    volumes:
      - tradingagents-data:/var/lib/tradingagents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  tradingagents-data:
